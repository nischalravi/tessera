# Tessera UI server: static files plus a reverse proxy to the API. Runs as uid 101 on a read-only root
# filesystem: everything writable lives under /tmp.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # The API caps request bodies at 1 MiB; keep the proxy at the same limit.
  client_max_body_size 1m;
  # No client addresses in the access log beyond what the API itself logs (method, path, status).
  log_format tessera '$request_method $uri $status $request_time';
  access_log /dev/stdout tessera;

  include /tmp/tessera.conf;
}
