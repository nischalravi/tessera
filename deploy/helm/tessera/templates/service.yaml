apiVersion: v1
kind: Service
metadata:
  name: {{ include "tessera.fullname" . }}
  labels: {{- include "tessera.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "tessera.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
{{- if .Values.metrics.enabled }}
---
# Metrics are on a separate listener and a separate Service so they never ride the ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tessera.fullname" . }}-metrics
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  clusterIP: None
  selector: {{- include "tessera.selectorLabels" . | nindent 4 }}
  ports:
    - { name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics }
{{- end }}
