{{- if .Values.csi.enabled }}
{{- $_ := required "csi.provider must be aws, azure or gcp" .Values.csi.provider -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "tessera.fullname" . }}
  labels: {{- include "tessera.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.csi.provider }}
  parameters: {{- toYaml (required "csi.parameters is required" .Values.csi.parameters) | nindent 4 }}
  secretObjects:
    - secretName: {{ include "tessera.secretName" . }}
      type: Opaque
      data:
        {{- range .Values.csi.objects }}
        - { objectName: {{ .objectName | quote }}, key: {{ .key | quote }} }
        {{- end }}
{{- end }}
