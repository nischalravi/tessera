{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tessera.fullname" . }}
  labels: {{- include "tessera.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "tessera.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - { port: 8080, protocol: TCP }
    {{- if .Values.metrics.enabled }}
    - from: {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - { port: {{ .Values.metrics.port }}, protocol: TCP }
    {{- end }}
  egress:
    - to:
        - namespaceSelector: {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        {{- range .Values.networkPolicy.databaseCIDRs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { port: {{ .Values.networkPolicy.databasePort }}, protocol: TCP }
    {{- if .Values.networkPolicy.allowHttpsEgress }}
    - ports:
        - { port: 443, protocol: TCP }
        - { port: 8443, protocol: TCP }
    {{- end }}
{{- end }}
