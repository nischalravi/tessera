# IBM i user profiles and special authorities (issue #561), read by a Directory Agent module inside
# the customer network. The agent reads QSYS2.USER_INFO through Mapepire (TLS WebSocket, port 8076; issue #612).
# Readiness live checks (reachability, TLS, sign-in, a read of QSYS2.USER_INFO) run as agent probe jobs that name the
# "ibmi" module, so the agent runs the Mapepire prober (issue #888). The agent and profile items stay attested: Tessera
# cannot see the agent's allowlist or the profile's authorities. Read-only; no write-back.
template: ibmi
version: 1.1.0
extends: base@1
display_name: IBM i (user profiles)
connector_types: [ibmi]
role: account_source
default_correlation_key: USER_NAME
default_hr_id_attribute: employeeNumber
required_attributes:
  user: [USER_NAME]
items:
  - id: ibmi.agent
    title: A Directory Agent in the IBM i network reads the profiles; the target is on its local allowlist and the credential is on the agent
    category: access
    level: required
    why: "IBM i is a private system, and its profile password must not be stored anywhere but the agent's own store."
    verify:
      - kind: attestation
    remediation:
      hint: "Install the agent, add the IBM i host and port to allowed_targets, store the credential with tessera-agent credential set, and reference it as agent:<id>/<name>."
    config_fields: [host, port, credential]

  - id: ibmi.profile.readonly
    title: A dedicated profile with no *ALLOBJ, *SECADM or *IOSYSCFG, granted only *USE to QSYS2.USER_INFO
    category: access
    level: required
    why: "Reading user profiles needs no special authority. A leaked all-object profile is control of the system."
    verify:
      - kind: attestation
    remediation:
      hint: "Create the profile with USRCLS(*USER) and SPCAUT(*NONE), and grant it the Db2 for i authority to select from QSYS2.USER_INFO (or the QIBM_DB_SECADM function usage)."
    config_fields: [bind_dn, credential]

  - id: ibmi.tls
    title: The connection to the IBM i uses TLS (the secure host server port)
    category: transport
    level: required
    why: "A profile password sent in clear text can be captured on the network."
    verify:
      - kind: live
        check: tls_handshake
        params: { min_version: "1.2" }
    remediation:
      hint: "Install Mapepire (TLS only, port 8076) with a certificate from your CA, and add that CA to the connection."
    config_fields: [host, port, tls_mode, ca_bundle]

  - id: ibmi.tls.chain
    title: The server certificate chains to a configured CA, the host name matches, and it is valid more than 30 days
    category: transport
    level: required
    why: "Without certificate validation anyone on the path can impersonate Mapepire and capture the profile password."
    verify:
      - kind: live
        check: tls_chain
        params: { min_days_valid: 30 }
    remediation:
      hint: "Add the CA that issued the Mapepire certificate to the connection, and renew the certificate before it expires."
    depends_on: [ibmi.tls]
    config_fields: [host, port, tls_mode, ca_bundle]

  - id: ibmi.reachable
    title: The Mapepire port is reachable from the agent
    category: access
    level: required
    why: "Baseline connectivity from the agent's network."
    verify:
      - kind: live
        check: endpoint_reachable
    remediation:
      hint: "Check that Mapepire is started (port 8076), that the host and port are on the agent's allowed_targets, and the firewall."
    config_fields: [host, port]

  - id: ibmi.signin
    title: The profile signs in and starts a read-only job
    category: access
    level: required
    why: "Baseline credential check."
    verify:
      - kind: live
        check: bind
    remediation:
      hint: "Check the profile name, that its password has not expired and the profile is not disabled, and that the agent's credential matches."
    depends_on: [ibmi.tls.chain]
    config_fields: [host, port, bind_dn, ca_bundle, credential]

  - id: ibmi.read.userinfo
    title: QSYS2.USER_INFO can be read
    category: scope
    level: required
    why: "The profile needs the Db2 for i authority to select from the catalog view; without it a sync returns nothing."
    verify:
      - kind: live
        check: sample_search
    remediation:
      hint: "Grant the profile the authority to select from QSYS2.USER_INFO (or the QIBM_DB_SECADM function usage)."
    depends_on: [ibmi.signin]
    config_fields: [bind_dn, credential]

  - id: ibmi.key.profile
    title: The profile name (USER_NAME) is the account key
    category: identity_keys
    level: required
    why: "A profile name is unique on the system. Renames create a new profile."
    verify:
      - kind: data
        check: key_unique
        params: { attr: USER_NAME }
    remediation:
      hint: "Automatic."
    depends_on: [base.correlation.key]
    config_fields: [correlation_key]

  - id: ibmi.status.disabled
    title: A profile with STATUS *DISABLED is a disabled account
    category: account_status
    level: required
    why: "Treating disabled profiles as active inflates access reviews; the reverse hides leavers."
    verify:
      - kind: attestation
    remediation:
      hint: "Automatic."

  - id: ibmi.groups.profiles
    title: Group profiles and supplemental groups resolve to profiles in scope
    category: groups
    level: recommended
    why: "Group profiles carry object authority for their members."
    verify:
      - kind: data
        check: member_resolution
    remediation:
      hint: "Automatic."

  - id: ibmi.priv.authorities
    title: All eight special authorities, the *SECOFR and *SECADM classes, and group profiles that hold them are tagged privileged, each with an expected-member list
    category: groups
    level: required
    why: "*ALLOBJ alone bypasses object authority checks; *SAVSYS copies any object, *SPLCTL reads every spooled file and *JOBCTL controls every job. A member of a group profile holds the group's special authorities."
    verify:
      - kind: attestation
      - kind: data
        check: privileged_unexpected
    remediation:
      hint: "List the expected members of each privileged group."
    config_fields: [privileged_expected]
