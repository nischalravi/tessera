name: CI

on:
  push:
    branches: [dev, test, prod, main]
  pull_request:
  merge_group: # lets a merge queue / ruleset be enabled later without another edit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filtering at job level (not top-level `paths:`) so skipped jobs still report
  # as skipped, which satisfies required checks. Non-PR events always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            go:
              - 'mvp/server/**'
              - '.github/workflows/ci.yml'
            web:
              - 'mvp/frontend/**'
              - '.github/workflows/ci.yml'

  # Fast static checks. Bound to the same `changes` gate as the test shards.
  lint:
    name: lint (Go)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mvp/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mvp/server/go.mod
          cache-dependency-path: mvp/server/go.sum
      - name: Schema number collisions
        run: scripts/check-schema-prefixes.sh
      - run: go mod download
      - run: go mod verify
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build -trimpath -o bin/tessera ./cmd/tessera

  # Tests run as parallel shards (go test arguments from mvp/server/scripts/ci-shard.sh; `rest`
  # is every package no other shard names, so new packages are never skipped, and the api
  # package's tests are dealt by name across api-1..api-3).
  backend-test:
    name: backend tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    # Self-hosted runner via repo variable TESSERA_RUNNER, but never for fork PRs.
    runs-on: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.TESSERA_RUNNER) || 'ubuntu-latest' }}
    # internal/api alone passed 45 minutes under -race, hence the api-N split.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [api-1, api-2, api-3, store, cmd, core, slow, groups, rest]
    defaults:
      run:
        working-directory: mvp/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mvp/server/go.mod
          cache-dependency-path: mvp/server/go.sum
      # -race makes the api parity suite slow on hosted runners (every request also
      # writes an audit event since #7), so the default 10m per-package limit is too tight.
      # Pull requests skip -race for the api shards only (the bottleneck); pushes to
      # dev/test/prod, merge queue and promotion runs keep full -race everywhere.
      - name: go test
        env:
          SHARD: ${{ matrix.shard }}
          EVENT: ${{ github.event_name }}
        run: |
          race=-race
          if [ "$EVENT" = pull_request ] && [[ "$SHARD" = api-* ]]; then race=; fi
          mapfile -t args < <(RACE=$race scripts/ci-shard.sh "$SHARD")
          echo "shard=$SHARD race=${race:-off} args=${#args[@]}"
          go test $race -timeout 45m "${args[@]}"

  # Stable required-check name: branch protection / rulesets keep requiring `backend (Go)`.
  # promote.yml waits on whole CI runs (gh run list --workflow ci.yml), so it needs no change.
  backend:
    name: backend (Go)
    needs: [changes, lint, backend-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate
        env:
          GO_CHANGED: ${{ needs.changes.outputs.go }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.backend-test.result }}
        run: |
          if [ "$GO_CHANGED" != true ]; then echo "no Go changes; skipped"; exit 0; fi
          echo "lint=$LINT tests=$TESTS"
          [ "$LINT" = success ] && [ "$TESTS" = success ]

  frontend:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mvp/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mvp/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # unit tests of the API client (node:test, no extra dependencies)
      - run: npm test
