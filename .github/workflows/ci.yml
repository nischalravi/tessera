name: CI

on:
  push:
    branches: [dev, test, prod, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: mvp/server/go.mod
          cache-dependency-path: mvp/server/go.sum
      - run: go mod download
      - run: go mod verify
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o bin/tessera ./cmd/tessera

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mvp/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
