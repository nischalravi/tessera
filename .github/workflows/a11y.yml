name: Accessibility

# WCAG 2.2 AA checks (issue #173): axe-core over every route and the sign-in
# page, reflow / text spacing / focus-not-obscured checks, and a keyboard-only
# walkthrough, against the real stack (run.sh: dev IdP, API, UI on their own
# ports). Fails on any serious or critical violation.

on:
  push:
    branches: [dev, test, prod, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mvp/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: mvp/server/go.mod
          cache-dependency-path: mvp/server/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mvp/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            mvp/frontend/playwright-report
            mvp/frontend/test-results
          retention-days: 7
