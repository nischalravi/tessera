# Gitleaks configuration: the default rules, plus an allowlist for fake
# credentials that tests and demo data need. Real secrets never belong in any
# of these places; a finding anywhere else still fails the secrets check.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures, recorded test traffic and demo seed data"
paths = [
  '''_test\.go$''',                                   # unit tests use fake tokens to assert redaction
  '''(^|/)testdata/''',                               # golden files and recorded API cassettes
  '''^mvp/server/internal/connectors/demo_company\.go$''', # demo tenant seed: fake commit SHAs and fingerprints
]
regexes = [
  '''^simulated_[a-z0-9_]+$''',                       # names of simulated providers (helpdesk "simulated_fido2")
]
