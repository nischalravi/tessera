<style>
/* Layout: operator console. Fixed left rail of views, main pane = summary strip then detail. Collapses to top tab bar on phones. */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --surface-2: #eaeef0;
  --line: #d5dde1;
  --fg: #12202a;
  --muted: #5a6b76;
  --accent: #0b6e78;
  --accent-soft: #d6eef0;
  --crit: #b4232f;
  --crit-soft: #fbe3e4;
  --warn: #9a5b00;
  --warn-soft: #fbefd6;
  --ok: #1d7a43;
  --ok-soft: #dcf2e4;
  --agent: #5b4bb5;
  --agent-soft: #e7e3fa;
  --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1418; --surface: #141e24; --surface-2: #1b272e; --line: #2a3a43;
    --fg: #e3ebef; --muted: #93a6b1; --accent: #45c2cc; --accent-soft: #123a3f;
    --crit: #ff6b76; --crit-soft: #3d1a1e; --warn: #f0b04a; --warn-soft: #3a2a10;
    --ok: #5fd28f; --ok-soft: #133222; --agent: #a99bff; --agent-soft: #262046;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1418; --surface: #141e24; --surface-2: #1b272e; --line: #2a3a43;
  --fg: #e3ebef; --muted: #93a6b1; --accent: #45c2cc; --accent-soft: #123a3f;
  --crit: #ff6b76; --crit-soft: #3d1a1e; --warn: #f0b04a; --warn-soft: #3a2a10;
  --ok: #5fd28f; --ok-soft: #133222; --agent: #a99bff; --agent-soft: #262046;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
nav.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; padding: 0 10px 4px; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.tenant { font-size: 12px; color: var(--muted); padding: 0 10px 16px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
nav.rail button { all: unset; cursor: pointer; padding: 8px 10px; border-radius: var(--r); color: var(--muted); display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
nav.rail button:hover { background: var(--surface-2); color: var(--fg); }
nav.rail button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
nav.rail button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-family: var(--f-mono); font-size: 11px; background: var(--surface-2); color: var(--muted); padding: 1px 6px; border-radius: 10px; }
.count.hot { background: var(--crit-soft); color: var(--crit); }
.proto-note { margin-top: auto; font-size: 11px; color: var(--muted); padding: 10px; border-top: 1px solid var(--line); }
main { padding-block: 28px 60px; padding-inline: 32px; min-width: 0; }
h1 { font-family: var(--f-display); font-size: 26px; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 4px; text-wrap: balance; }
h2 { font-family: var(--f-display); font-size: 17px; font-weight: 600; margin: 0 0 12px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 24px; max-width: 70ch; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 16px; }
.kpi .v { font-family: var(--f-display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 6px; }
.kpi .d { font-size: 12px; color: var(--muted); margin-top: 4px; }
.kpi.crit .v { color: var(--crit); }
.kpi.warn .v { color: var(--warn); }
.two { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.agent { background: var(--agent-soft); color: var(--agent); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.who { font-weight: 600; }
.who small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.btn { font: inherit; font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); border-color: var(--crit); background: transparent; }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.list-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: none; }
.sev { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
.sev.crit { background: var(--crit); } .sev.warn { background: var(--warn); } .sev.ok { background: var(--ok); } .sev.agent { background: var(--agent); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
select, input[type="text"] { font: inherit; padding: 7px 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-width: 0; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
.graphwrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.graphwrap svg { display: block; min-width: 900px; width: 100%; height: auto; }
svg text { font-family: var(--f-body); }
.codeblock { font-family: var(--f-mono); font-size: 12.5px; background: var(--surface-2); border-radius: var(--r); padding: 12px 14px; overflow-x: auto; white-space: pre; line-height: 1.6; color: var(--fg); }
.codeblock .k { color: var(--accent); font-weight: 500; }
.codeblock .c { color: var(--muted); }
.diff-add { color: var(--ok); } .diff-del { color: var(--crit); }
.blast { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 16px; }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 20px; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-weight: 500; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100vw - 40px); }
.toast.show { opacity: 1; transform: none; }
.chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }
.chain .node { padding: 4px 10px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); }
.chain .node.agent { background: var(--agent-soft); color: var(--agent); border-color: transparent; font-weight: 600; }
.chain .node.bad { background: var(--crit-soft); color: var(--crit); border-color: transparent; font-weight: 600; }
.chain .arrow { color: var(--muted); }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 10px 14px; border-top: 1px solid var(--line); }
.legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav.rail { position: static; height: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding: 10px 16px; border-right: none; border-bottom: 1px solid var(--line); gap: 4px; }
  .brand { padding: 0 8px 0 0; font-size: 17px; }
  .tenant, .proto-note { display: none; }
  nav.rail button { white-space: nowrap; flex: none; }
  nav.rail button .count { margin-left: 6px; }
  main { padding-inline: 16px; padding-block: 20px 60px; }
  h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</div>

    // unique nodes per column
    const colNodes = [[idn.name], [], [], [], [], []];
    paths.forEach(p => { for (let c = 0; c < 5; c++) if (!colNodes[c + 1].includes(p[c])) colNodes[c + 1].push(p[c]); });
    const pos = (c, label) => {
      const arr = colNodes[c], i = arr.indexOf(label), gap = rowsH / arr.length;

    };

      const chain = [idn.name, ...p.slice(0, 5)];

    colNodes.forEach((arr, c) => arr.forEach(label => {

      const isId = c === 0;
      const fill = isId ? (idn.kind === "agent" ? "var(--agent-soft)" : "var(--accent-soft)") : "var(--surface-2)";
      const tc = isId ? (idn.kind === "agent" ? "var(--agent)" : "var(--accent)") : "var(--fg)";

    return `<svg viewBox="0 0 ${W + 30} ${H}" role="img" aria-label="Access paths for ${esc(idn.name)}">${heads}${edges}${nodes}</svg>`;

          <div><span class="pill warn">New grant</span> Tomas Varga gains payments:approve (he already holds payments:read only, so no new conflict)</div>
          <div><span class="pill neutral">Loses</span> Marcus Feld loses approve on 41 payments in the last 30 days; 3 open approvals reassign to Ana Brightwater</div>
          <div><span class="pill ok">No change</span> 0 other identities affected</div></div></div>` : ""}
      </div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))">
        ${D.policies.map(p => {
          const v = simOn && p.id === "sod-payments" ? [] : p.violations;
          return `<div class="panel stack"><div class="spread"><h2 style="margin:0">${esc(p.name)}</h2><span class="pill ${v.length ? "crit" : "ok"}">${v.length ? v.length + " violating" : "Passing"}</span></div>
            <div class="codeblock">${p.code}</div>
            ${v.length ? `<div class="row">${v.map(x => `<span class="pill neutral">${esc(x)}</span>`).join("")}</div>` : '<div class="small muted">No violations after this change.</div>'}</div>`;
        }).join("")}
      </div>`;
    document.getElementById("sim").addEventListener("click", () => { simOn = !simOn; render("policy"); });
  };

  views.review = () => {
    const done = D.review.filter(r => r.d).length;
    main.innerHTML = `
      <h1>Q4 SOX access review</h1>
      <p class="sub">Tessera certified 4,204 low-risk items automatically, based on usage and peer groups. Reviewers decide only the exceptions below, each with the context needed to decide.</p>
      <div class="panel" style="margin-bottom:16px"><div class="spread"><span><b>${done}</b> of ${D.review.length} decided</span><span class="small muted">Evidence package exports to auditors on completion</span></div><div class="bar" style="margin-top:8px"><span style="width:${(done / D.review.length) * 100}%"></span></div></div>
      <div class="panel">
        ${D.review.map(r => `<div class="list-item"><span class="sev ${r.d === "keep" ? "ok" : r.d === "revoke" ? "crit" : "warn"}"></span>
          <div style="flex:1;min-width:0"><div class="who">${esc(r.who)} <small>${esc(r.what)}</small></div>
            <div class="small"><span class="pill warn">${esc(r.why)}</span> <span class="muted">${esc(r.ctx)}</span></div></div>
          ${r.d ? `<span class="pill ${r.d === "keep" ? "ok" : "crit"}">${r.d === "keep" ? "Kept" : "Revoked"}</span><button class="btn sm" data-r="${r.id}" data-a="undo">Undo</button>` : `<div class="row"><button class="btn sm" data-r="${r.id}" data-a="keep">Keep</button><button class="btn sm danger" data-r="${r.id}" data-a="revoke">Revoke</button></div>`}
        </div>`).join("")}
      </div>`;
    main.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => {
      const r = D.review.find(x => x.id === b.dataset.r);
      r.d = b.dataset.a === "undo" ? null : b.dataset.a;
      updateCounts(); render("review");
      if (D.review.every(x => x.d)) toast("Review complete. Evidence package ready.");
    }));
  };

  function updateCounts() {
    const set = (id, n, hot) => { const el = document.getElementById(id); el.textContent = n; el.classList.toggle("hot", !!hot && n > 0); el.hidden = n === 0; };
    const nhiOpen = D.nhi.filter(n => n.sev === "crit").length;
    set("c-nhi", nhiOpen + 6, true);
    set("c-lp", D.recs.length);
    set("c-jit", D.jit.filter(j => j.state === "pending").length);
    set("c-pol", simOn ? 3 : 4, true);
    set("c-rev", D.review.filter(r => !r.d).length);
  }

  let current = "overview";
  function render(v) {
    current = v;
    document.querySelectorAll("nav.rail button").forEach(b => b.toggleAttribute("aria-current", false));
    const btn = document.querySelector(`nav.rail button[data-view="${v}"]`);
    if (btn) btn.setAttribute("aria-current", "page");
    views[v]();
    main.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
      if (b.dataset.focus) graphFocus = b.dataset.focus;
      render(b.dataset.go); window.scrollTo(0, 0);
    }));
  }
  document.querySelectorAll("nav.rail button").forEach(b => b.addEventListener("click", () => { render(b.dataset.view); window.scrollTo(0, 0); }));
  const start = (location.hash || "").slice(1);
  updateCounts();
  render(views[start] ? start : "overview");
})();
</script>
